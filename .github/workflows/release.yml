name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TARGET: windows/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Read the version
        run: |
          version=$(python3 -c "import json; print(json.load(open('mygo.json'))['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag against the configuration
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "the tag ${GITHUB_REF_NAME} does not match the version $VERSION in mygo.json"
            exit 1
          fi
      - name: Build and upload
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform "${TARGET}" -upload
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: build/windows-amd64
          if-no-files-found: error
      - name: Check the update files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="build/windows-amd64"
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for file in "update-windows-amd64.json" "opensteamtool-gui-mygo-$VERSION-windows-amd64.tar.gz"; do
            if [ ! -f "$out/$file" ]; then
              echo "the build is missing $file"
              exit 1
            fi
            if ! printf '%s\n' "$assets" | grep -qx "$file"; then
              echo "the draft release is missing $file"
              exit 1
            fi
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
